services:
    mysql:
        image: mysql:8.4
        container_name: sans-inc-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: sans_inc_pagina_web
            MYSQL_USER: user
            MYSQL_PASSWORD: pass
            MYSQL_ROOT_PASSWORD: slatan1020
        ports:
            - "3307:3306"
        volumes:
            - sans_inc_mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppass"]
            interval: 10s
            timeout: 5s
            retries: 5

    phpmyadmin:
        image: phpmyadmin:5
        container_name: sans-inc-phpmyadmin
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: user
            PMA_PASSWORD: pass
            UPLOAD_LIMIT: 64M
        ports:
            - "8081:80"

volumes:
    sans_inc_mysql_data:
